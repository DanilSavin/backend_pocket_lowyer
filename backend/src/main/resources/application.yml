spring:
  config:
    import: optional:file:./.env[.properties],optional:file:./backend/.env[.properties],optional:configtree:/run/secrets/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  error:
    include-message: always

gigachat:
  auth-key: ${GIGACHAT_AUTH_KEY:}
  scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
  model: ${GIGACHAT_MODEL:GigaChat-3-Ultra}

logging:
  file:
    name: logs/pocket-lawyer.log
  level:
    ru.pocketlawyer: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
